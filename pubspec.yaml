name: baytari
description: "Baytari (بيطري) — a veterinary app connecting pet owners with vets and clinics."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management — Cubit only, per architecture spec.
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  # Dependency injection.
  get_it: ^9.0.0
  # Networking.
  dio: ^5.9.0
  # Backend (Supabase) — data layer only.
  supabase_flutter: ^2.12.0
  # Local persistence for theme + language.
  shared_preferences: ^2.5.3
  # Routing.
  go_router: ^16.2.0
  # Fonts — Cairo (user's choice, 2026-11-07) via google_fonts, so the
  # font files are fetched from Google Fonts at runtime and cached;
  # no binary font files need to live in the repo.
  google_fonts: ^6.2.1
  # Profile photo + licence photo (auth UI, Figma design).
  image_picker: ^1.1.2
  # Vector illustrations — all artwork is SVG exported from Figma
  # (onboarding, Get Started, splash loading cat, shelter card).
  flutter_svg: ^2.0.17
  # Toast messages (replaces SnackBar everywhere, user's choice).
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
