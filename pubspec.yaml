name: baytari
description: "Baytari (بيطري) — a veterinary app connecting pet owners with vets and clinics."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management — Cubit only, per architecture spec.
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  # Dependency injection.
  get_it: ^9.0.0
  # Networking.
  dio: ^5.9.0
  # Backend (Supabase) — data layer only.
  supabase_flutter: ^2.12.0
  # Local persistence for theme + language.
  shared_preferences: ^2.5.3
  # Routing.
  go_router: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
